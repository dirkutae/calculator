<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-blue: #007AFF;
            --apple-orange-dark: #C45100;
            --apple-orange-btn: #FF9500;
            --apple-gray: #8E8E93;
            --text-dark: #1d1d1f;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px; 
            background: #f2f2f7; 
            color: var(--text-dark); 
            margin: 0;
            overflow: hidden; /* Предотвращаем лишнюю прокрутку */
        }

        .field-group { 
            margin-bottom: 10px; 
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 14px; /* Скругление как у Apple */
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        label { 
            display: block; 
            font-size: 10px; 
            color: var(--apple-gray); 
            margin-bottom: 3px; 
            text-transform: uppercase; 
            letter-spacing: 0.4px;
            font-weight: 600; 
        }

        select, input { 
            width: 100%; 
            height: 32px; 
            border: none; 
            background: transparent;
            font-size: 15px; 
            color: #000;
            outline: none;
            border-radius: 8px;
        }

        /* Информационное поле дня недели */
        .info-field { color: #555; font-weight: 500; cursor: default; }

        /* Кастомизация иконки календаря - Скругление */
        input[type="date"] { border-radius: 10px; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            font-size: 20px;
            cursor: pointer;
            filter: invert(33%) sepia(94%) saturate(2453%) hue-rotate(206deg) brightness(102%) contrast(107%);
        }

        /* Всегда видимые и синие стрелочки */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1 !important;
            height: 32px;
            width: 24px;
            filter: invert(33%) sepia(94%) saturate(2453%) hue-rotate(206deg) brightness(102%) contrast(107%);
            cursor: pointer;
        }

        /* Предупреждение */
        #warning { 
            display: none; 
            background: var(--apple-orange-dark); 
            color: white; 
            padding: 10px; 
            border-radius: 12px; 
            font-size: 12px; 
            margin-bottom: 12px; 
            font-weight: 600; 
            text-align: center;
        }

        /* Контейнер результата (Жирный текст) */
        .res-container { 
            margin-top: 12px; 
            padding: 16px; 
            background: #fff;
            border-radius: 18px; 
            border: 1px solid rgba(0,0,0,0.05); 
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: 800;
        }

        .calc-line { font-size: 14px; color: var(--text-dark); margin-bottom: 6px; line-height: 1.4; }
        .offer-line { font-size: 14px; color: var(--apple-orange-dark); text-transform: uppercase; }

        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        
        .btn { 
            height: 46px; border: none; border-radius: 16px; cursor: pointer; 
            font-weight: 700; font-size: 13px; color: white; text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-blue { background: linear-gradient(180deg, #007AFF 0%, #0056B3 100%); }
        .btn-orange { background: linear-gradient(180deg, var(--apple-orange-btn) 0%, #E67E22 100%); }
        
        .btn:active { transform: scale(0.97); }

        .logo-container { margin-top: 20px; text-align: center; }
        .logo-container img { max-width: 180px; height: auto; border: none; }
    </style>
</head>
<body>

    <div id="warning">⚠️ МИНИМУМ 3 ЧАСА В ЭТОТ ДЕНЬ</div>

    <div class="field-group">
        <label>Зал</label>
        <select id="room" onchange="calculate()">
            <option value="Грейпфрут">Грейпфрут</option>
            <option value="Бергамот">Бергамот</option>
            <option value="Помело">Помело</option>
            <option value="Шале">Шале</option>
            <option value="Свити">Свити</option>
            <option value="Мандарин">Мандарин</option>
            <option value="Лайм">Лайм</option>
            <option value="Библиотека">Библиотека</option>
        </select>
    </div>

    <div class="field-group">
        <label>Дата события</label>
        <input type="date" id="eventDate" onchange="calculate()">
    </div>

    <div class="field-group">
        <label>День недели (авто)</label>
        <input type="text" id="dayNameDisplay" class="info-field" readonly>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="field-group" style="flex: 1;">
            <label>Часы</label>
            <input type="number" id="hours" value="3" min="1" oninput="calculate()">
        </div>
        <div class="field-group" style="flex: 1;">
            <label>Скидка %</label>
            <input type="number" id="discount" placeholder="10" oninput="calculate()">
        </div>
    </div>

    <div class="res-container" id="resultBox">
        <div id="calcText" class="calc-line"></div>
        <div id="offerText" class="offer-line"></div>
    </div>

    <div class="btn-group">
        <button class="btn btn-blue" onclick="copyText('no-disc')">Скопировать расчет</button>
        <button class="btn btn-orange" onclick="copyText('with-disc')">Скопировать со скидкой</button>
    </div>

    <div class="logo-container">
        <img src="logo.png" alt="Citrus Hall">
    </div>

    <script>
        const priceList = {
            "Грейпфрут": [4000, 3000, 3700, 3700, 3700, 5000, 7500],
            "Бергамот":  [4000, 3000, 3200, 3200, 3200, 5000, 6900],
            "Помело":    [3000, 2300, 2500, 2500, 2500, 3500, 4800],
            "Шале":      [3200, 2300, 2500, 2500, 2500, 3500, 5100],
            "Свити":     [3000, 2000, 2200, 2200, 2200, 3500, 4600],
            "Мандарин":  [2500, 1900, 1900, 1900, 1900, 2800, 3300],
            "Лайм":      [2000, 1000, 1000, 1000, 1000, 2000, 2000],
            "Библиотека":[2000, 1000, 1000, 1000, 1000, 2000, 2000]
        };

        const daysNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('eventDate').value = today;
            calculate();
        };

        function calculate() {
            const zalName = document.getElementById('room').value;
            const dateVal = document.getElementById('eventDate').value;
            const h = Number(document.getElementById('hours').value) || 0;
            let discInput = document.getElementById('discount').value;
            let discPct = (discInput === "" || discInput === null) ? 10 : Number(discInput);

            const dateObj = new Date(dateVal);
            const dayIdx = dateObj.getDay(); 
            const dayName = daysNames[dayIdx];
            
            // Заполняем поле дня недели
            document.getElementById('dayNameDisplay').value = dayName;

            const rate = priceList[zalName][dayIdx];
            const cleaning = (zalName === "Лайм" || zalName === "Библиотека") ? 1000 : 2000;
            
            const baseTotal = (rate * h) + cleaning;
            const totalWithDiscount = Math.round(baseTotal * (1 - discPct / 100));

            const warningEl = document.getElementById('warning');
            const isWeekend = (dayIdx === 0 || dayIdx === 5 || dayIdx === 6);
            const minHours = isWeekend ? 5 : 3;

            if (h < minHours && h > 0) {
                warningEl.style.display = 'block';
                warningEl.innerText = `⚠️ МИНИМУМ ${minHours} ЧАСА В ЭТОТ ДЕНЬ`;
            } else {
                warningEl.style.display = 'none';
            }

            document.getElementById('calcText').innerText = `Зал ${zalName}: ${rate}р * ${h}ч + ${cleaning} (уборка) = ${baseTotal} руб`;
            document.getElementById('offerText').innerText = `ПРИ ОПЛАТЕ СЕГОДНЯ СО СКИДКОЙ ${discPct}% ИТОГО ${totalWithDiscount} руб`;
        }

        function copyText(mode) {
            const line1 = document.getElementById('calcText').innerText;
            const line2 = document.getElementById('offerText').innerText;
            const textToCopy = (mode === 'no-disc') ? line1 : line1 + '\n' + line2;

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const resultBox = document.getElementById('resultBox');
                resultBox.style.borderColor = "#007AFF";
                setTimeout(() => { resultBox.style.borderColor = "rgba(0,0,0,0.05)"; }, 600);
            } catch (err) { console.error(err); }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>

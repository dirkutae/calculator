<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, sans-serif; padding: 12px; background: #fff; color: #333; }
        .field-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: #86939e; margin-bottom: 3px; text-transform: uppercase; font-weight: bold; }
        select, input { width: 100%; height: 36px; border: 1px solid #dbdee0; border-radius: 4px; padding: 0 10px; box-sizing: border-box; font-size: 14px; }
        
        #warning { display: none; background: #ff9800; color: white; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; font-weight: bold; text-align: center; }
        
        /* Увеличенное поле результата */
        .res-container { 
            margin-top: 15px; 
            padding: 15px; 
            background: #fdfdfd; 
            border-radius: 6px; 
            border: 2px solid #ebf0f2; 
            min-height: 100px; /* Увеличенная высота */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .calc-line { font-size: 13px; color: #333; margin-bottom: 6px; font-family: "Courier New", Courier, monospace; line-height: 1.4; }
        .offer-line { font-size: 13px; font-weight: bold; color: #d35400; text-transform: uppercase; font-family: sans-serif; }
        
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 15px; }
        .btn { height: 42px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; color: white; text-transform: uppercase; }
        .btn-copy-no-disc { background: #8e44ad; }
        .btn-copy-disc { background: #2980b9; }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="warning">⚠️ СЛИШКОМ МАЛО ЧАСОВ</div>

    <div class="field-group">
        <label>Зал</label>
        <select id="room" onchange="calculate()">
            <option value="Грейпфрут">Грейпфрут</option>
            <option value="Бергамот">Бергамот</option>
            <option value="Помело">Помело</option>
            <option value="Шале">Шале</option>
            <option value="Свити">Свити</option>
            <option value="Мандарин">Мандарин</option>
            <option value="Лайм">Лайм</option>
            <option value="Библиотека">Библиотека</option>
        </select>
    </div>

    <div class="field-group">
        <label>День недели</label>
        <select id="dayOfWeek" onchange="calculate()">
            <option value="1">Понедельник</option>
            <option value="2">Вторник</option>
            <option value="3">Среда</option>
            <option value="4">Четверг</option>
            <option value="5">Пятница</option>
            <option value="6">Суббота</option>
            <option value="0">Воскресенье</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="field-group" style="flex: 1;">
            <label>Часы</label>
            <input type="number" id="hours" value="3" min="1" oninput="calculate()">
        </div>
        <div class="field-group" style="flex: 1;">
            <label>Скидка %</label>
            <input type="number" id="discount" placeholder="10" oninput="calculate()">
        </div>
    </div>

    <div class="res-container" id="resultBox">
        <div id="calcText" class="calc-line"></div>
        <div id="offerText" class="offer-line"></div>
    </div>

    <div class="btn-group">
        <button class="btn btn-copy-no-disc" onclick="copyText('no-disc')">Скопировать расчет</button>
        <button class="btn btn-copy-disc" onclick="copyText('with-disc')">Скопировать с предложением</button>
    </div>

    <script>
        const priceList = {
            "Грейпфрут": [4000, 3000, 3700, 3700, 3700, 5000, 7500],
            "Бергамот":  [4000, 3000, 3200, 3200, 3200, 5000, 6900],
            "Помело":    [3000, 2300, 2500, 2500, 2500, 3500, 4800],
            "Шале":      [3200, 2300, 2500, 2500, 2500, 3500, 5100],
            "Свити":     [3000, 2000, 2200, 2200, 2200, 3500, 4600],
            "Мандарин":  [2500, 1900, 1900, 1900, 1900, 2800, 3300],
            "Лайм":      [2000, 1000, 1000, 1000, 1000, 2000, 2000],
            "Библиотека":[2000, 1000, 1000, 1000, 1000, 2000, 2000]
        };

        window.onload = function() {
            const today = new Date().getDay();
            document.getElementById('dayOfWeek').value = today;
            calculate();
        };

        function calculate() {
            const zalName = document.getElementById('room').value;
            const dayIdx = parseInt(document.getElementById('dayOfWeek').value);
            const h = Number(document.getElementById('hours').value) || 0;
            
            let discInput = document.getElementById('discount').value;
            let discPct = (discInput === "" || discInput === null) ? 10 : Number(discInput);

            const rate = priceList[zalName][dayIdx];
            const cleaning = (zalName === "Лайм" || zalName === "Библиотека") ? 1000 : 2000;
            
            const baseTotal = (rate * h) + cleaning;
            const totalWithDiscount = Math.round(baseTotal * (1 - discPct / 100));

            const warningEl = document.getElementById('warning');
            const isWeekend = (dayIdx === 0 || dayIdx === 5 || dayIdx === 6);
            const minHours = isWeekend ? 5 : 3;

            if (h < minHours && h > 0) {
                warningEl.style.display = 'block';
                warningEl.innerText = `⚠️ МИНИМУМ ${minHours} ЧАСОВ В ЭТОТ ДЕНЬ`;
            } else {
                warningEl.style.display = 'none';
            }

            // Название зала добавлено в начало строки
            const line1 = `Зал ${zalName}: ${rate}р * ${h}ч + ${cleaning} (уборка) = ${baseTotal} руб`;
            const line2 = `ПРИ ОПЛАТЕ СЕГОДНЯ СО СКИДКОЙ ${discPct}% ИТОГО ${totalWithDiscount} руб`;

            document.getElementById('calcText').innerText = line1;
            document.getElementById('offerText').innerText = line2;
        }

        async function copyText(mode) {
            const line1 = document.getElementById('calcText').innerText;
            const line2 = document.getElementById('offerText').innerText;
            const textToCopy = (mode === 'no-disc') ? line1 : line1 + '\n' + line2;

            try {
                await navigator.clipboard.writeText(textToCopy);
                const originalBoxColor = document.getElementById('resultBox').style.borderColor;
                document.getElementById('resultBox').style.borderColor = '#2ecc71';
                setTimeout(() => {
                    document.getElementById('resultBox').style.borderColor = '#ebf0f2';
                }, 1000);
            } catch (err) {
                alert('Ошибка копирования');
            }
        }
    </script>
</body>
</html>

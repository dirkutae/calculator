<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-blue: #007AFF;
            --apple-orange: #FF9500;
            --apple-gray: #8E8E93;
            --text-dark: #1d1d1f;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 10px; background: #f2f2f7; color: var(--text-dark); margin: 0; overflow: hidden; 
        }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { max-width: 130px; height: auto; mix-blend-mode: multiply; }
        .warning-wrapper { height: 42px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
        #warning { 
            display: none; width: 100%; background: var(--apple-orange); color: white; 
            padding: 10px; border-radius: 21px; font-size: 11px; font-weight: 600; text-align: center; box-sizing: border-box; 
        }
        .field-group { 
            margin-bottom: 6px; background: var(--glass-bg); backdrop-filter: blur(10px); 
            padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.5); 
        }
        label { display: block; font-size: 9px; color: var(--apple-gray); margin-bottom: 2px; text-transform: uppercase; font-weight: 600; }
        select, input { width: 100%; height: 26px; border: none; background: transparent; font-size: 14px; color: #000; outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { 
            font-size: 26px; cursor: pointer; filter: invert(33%) sepia(94%) saturate(2453%) hue-rotate(206deg) brightness(102%) contrast(107%); 
        }
        input[type="number"]::-webkit-inner-spin-button { opacity: 1 !important; height: 26px; width: 25px; background: #fff; border-radius: 4px; }
        .res-container { 
            margin-top: 15px; margin-bottom: 15px; padding: 12px; background: #fff; 
            border-radius: 14px; border: 1px solid rgba(0,0,0,0.05); min-height: 75px; 
            display: flex; flex-direction: column; justify-content: center; text-align: center; 
        }
        .calc-line { font-size: 13px; color: var(--text-dark); font-weight: 800; margin-bottom: 4px; }
        .offer-line { font-size: 13px; color: var(--apple-orange); font-weight: 800; text-transform: uppercase; }
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
        .btn { 
            height: 44px; border: none; border-radius: 22px; cursor: pointer; 
            font-weight: 700; font-size: 12px; color: white; text-transform: uppercase; transition: transform 0.1s; 
        }
        .btn-blue { background: #007AFF; }
        .btn-orange { background: var(--apple-orange); }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Citrus Hall"></div>
    <div class="warning-wrapper"><div id="warning"></div></div>
    
    <div class="field-group">
        <label>Зал</label>
        <select id="room" onchange="calculate()">
            <option value="Грейпфрут">Грейпфрут</option>
            <option value="Бергамот">Бергамот</option>
            <option value="Помело">Помело</option>
            <option value="Шале">Шале</option>
            <option value="Свити">Свити</option>
            <option value="Мандарин">Мандарин</option>
            <option value="Лайм">Лайм</option>
            <option value="Библиотека">Библиотека</option>
        </select>
    </div>
    
    <div class="field-group"><label>Дата события</label><input type="date" id="eventDate" onchange="calculate()"></div>
    <div class="field-group"><label>День недели</label><input type="text" id="dayNameDisplay" readonly style="color: #555;"></div>
    
    <div style="display: flex; gap: 8px;">
        <div class="field-group" style="flex: 1;"><label>Часы</label><input type="number" id="hours" value="5" min="1" oninput="calculate()"></div>
        <div class="field-group" style="flex: 1;"><label>Скидка %</label><input type="number" id="discount" value="10" oninput="calculate()"></div>
    </div>
    
    <div class="res-container" id="resultBox">
        <div id="calcText" class="calc-line"></div>
        <div id="offerText" class="offer-line"></div>
    </div>
    
    <div class="btn-group">
        <button class="btn btn-blue" onclick="copyText('no-disc')">Скопировать расчет</button>
        <button class="btn btn-orange" onclick="copyText('with-disc')">Скопировать со скидкой</button>
    </div>

    <script>
        const priceList = {
            "Грейпфрут": [4000, 3000, 3700, 3700, 3700, 5000, 7500],
            "Бергамот":  [4000, 3000, 3200, 3200, 3200, 5000, 6900],
            "Помело":    [3000, 2300, 2500, 2500, 2500, 3500, 4800],
            "Шале":      [3200, 2300, 2500, 2500, 2500, 3500, 5100],
            "Свити":     [3000, 2000, 2200, 2200, 2200, 3500, 4600],
            "Мандарин":  [2500, 1900, 1900, 1900, 1900, 2800, 3300],
            "Лайм":      [2000, 1000, 1000, 1000, 1000, 2000, 2000],
            "Библиотека":[2000, 1000, 1000, 1000, 1000, 2000, 2000]
        };
        const daysNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        function formatPrice(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

        function init() {
            const params = new URLSearchParams(window.location.search);
            const rawName = params.get('name') || "";
            let name = decodeURIComponent(rawName);
            
            let foundDate = null;
            let foundHours = 5;

            // 1. Ищем ДАТУ и удаляем её из временной строки, чтобы не путать с часами
            // Паттерн ищет "19-20.03" или "09.03"
            const dateRegex = /(\d{1,2}(?:-\d{1,2})?)\.(\d{2})/;
            const dateMatch = name.match(dateRegex);
            
            if (dateMatch) {
                // Извлекаем первое число дня (из 19-20 берем 19)
                let dayPart = dateMatch[1].split('-')[0];
                let monthPart = dateMatch[2];
                let year = new Date().getFullYear();
                foundDate = `${year}-${monthPart.padStart(2, '0')}-${dayPart.padStart(2, '0')}`;
                
                // Удаляем найденную дату из строки поиска для часов
                name = name.replace(dateRegex, 'DATE_STUB');
            }

            // 2. Ищем ЧАСЫ в оставшейся строке
            const timeMatch = name.match(/(?:с\s*)?(\d{1,2})(?::\d{2})?\s*(?:-|до)\s*(\d{1,2})(?::\d{2})?/i);
            if (timeMatch) {
                let start = parseInt(timeMatch[1], 10);
                let end = parseInt(timeMatch[2], 10);
                
                // Переход через полночь
                if (end <= start && end < 12) end += 24; 
                foundHours = end - start;
            }

            document.getElementById('eventDate').value = foundDate || new Date().toISOString().split('T')[0];
            document.getElementById('hours').value = foundHours;
            calculate();
        }

        function calculate() {
            const z = document.getElementById('room').value, 
                  dVal = document.getElementById('eventDate').value, 
                  h = Number(document.getElementById('hours').value) || 0, 
                  dp = Number(document.getElementById('discount').value) || 0;
            
            const dObj = new Date(dVal), dIdx = dObj.getDay();
            document.getElementById('dayNameDisplay').value = daysNames[dIdx] || "";
            
            const rate = priceList[z][dIdx], 
                  cl = (z === "Лайм" || z === "Библиотека") ? 1000 : 2000, 
                  bt = (rate * h) + cl, 
                  td = Math.round(bt * (1 - dp/100));
            
            const w = document.getElementById('warning'), mh = (dIdx === 0 || dIdx === 5 || dIdx === 6) ? 5 : 3;
            
            if (h < mh && h > 0) { 
                w.style.display = 'block'; 
                w.innerText = `⚠️ МИНИМУМ ${mh} ${mh === 5 ? 'ЧАСОВ' : 'ЧАСА'} В ЭТОТ ДЕНЬ`; 
            } else { 
                w.style.display = 'none'; 
            }
            
            document.getElementById('calcText').innerText = `Зал ${z}: ${formatPrice(rate)}р * ${h}ч + ${formatPrice(cl)} (уборка) = ${formatPrice(bt)} руб`;
            document.getElementById('offerText').innerText = `ПРИ ОПЛАТЕ СЕГОДНЯ СО СКИДКОЙ ${dp}% ИТОГО ${formatPrice(td)} руб`;
        }

        function copyText(m) {
            const t = (m === 'no-disc') ? document.getElementById('calcText').innerText : 
                      document.getElementById('calcText').innerText + '\n' + document.getElementById('offerText').innerText;
            const el = document.createElement("textarea"); el.value = t; document.body.appendChild(el); el.select(); 
            document.execCommand('copy'); document.body.removeChild(el);
            const rb = document.getElementById('resultBox'); rb.style.borderColor = "#007AFF"; 
            setTimeout(() => { rb.style.borderColor = "rgba(0,0,0,0.05)"; }, 600);
        }

        window.onload = init;
    </script>
</body>
</html>
